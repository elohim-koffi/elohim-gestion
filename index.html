<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELOHÏM-GESTION V2.4 FUSION</title>
<meta name="theme-color" content="#667eea">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;min-height:100vh}
.glass{background:rgba(255,255,255,0.15);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.2);box-shadow:0 8px 32px rgba(0,0,0,0.1)}
.btn-hover{transition:all 0.3s ease}
.btn-hover:hover{transform:translateY(-2px);box-shadow:0 10px 20px rgba(0,0,0,0.2)}
input:focus,select:focus{outline:none;ring:2px;ring-color:#fff}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-track{background:rgba(255,255,255,0.1)}::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.3);border-radius:4px}
.fade-in{animation:fadeIn 0.5s ease}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.benefice{color:#4ade80;font-weight:bold}
.tab-active{background:rgba(255,255,255,0.3);font-weight:bold}
.stock-faible{color:#fbbf24}
.stock-epuise{color:#ef4444}
</style>
</head>
<body class="p-2 md:p-4">
<div id="app"></div>
<script>
const APP_NAME="ELOHÏM-GESTION V2.4 FUSION";
const APP_VERSION="2.4.1";
let DB={entreprise:null,user:null,ventes:[],produits:[],depenses:[],dateCreation:null};
let currentTab='caisse';

function saveDB(){localStorage.setItem('ELOHIM_DB_V24F',JSON.stringify(DB))}
function loadDB(){let d=localStorage.getItem('ELOHIM_DB_V24F');if(d){DB=JSON.parse(d);return true}return false}
function formatFCFA(n){return n.toLocaleString('fr-FR')+' FCFA'}
function getToday(){return new Date().toLocaleDateString('fr-FR')}
function getTime(){return new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}

function showLogin(){document.getElementById('app').innerHTML=`<div class="max-w-md mx-auto mt-10 md:mt-20 glass rounded-3xl p-6 md:p-8 text-white fade-in"><div class="text-center mb-6"><h1 class="text-3xl md:text-4xl font-bold mb-2">${APP_NAME}</h1><p class="opacity-80 text-sm">Caisse + Stock + Bénéfice + Dépenses</p><p class="opacity-60 text-xs mt-1">Wave • MTN MoMo • Orange Money • Cash</p></div>${DB.entreprise?`<div class="bg-white/10 rounded-2xl p-4 mb-6 text-center"><h2 class="text-xl font-bold">${DB.entreprise.nom}</h2><p class="opacity-80 text-sm">${DB.entreprise.secteur}</p><p class="opacity-60 text-xs mt-1">Client depuis ${DB.dateCreation}</p></div>`:`<input id="nomEnt" placeholder="Nom de votre entreprise" class="w-full p-3 mb-3 rounded-xl text-black font-semibold"><select id="secteur" class="w-full p-3 mb-3 rounded-xl text-black"><option>Bar / Cave</option><option>Maquis / Restaurant</option><option>Boutique / Superette</option><option>Salon de coiffure</option><option>Pharmacie</option><option>Quincaillerie</option><option>Autre commerce</option></select>`}<input id="tel" placeholder="Numéro WhatsApp du gérant" class="w-full p-3 mb-3 rounded-xl text-black" type="tel"><input id="mdp" type="password" placeholder="Mot de passe sécurisé" class="w-full p-3 mb-4 rounded-xl text-black"><button onclick="login()" class="w-full bg-white text-purple-700 p-3 rounded-xl font-bold text-lg btn-hover">${DB.entreprise?'Se connecter':'Créer mon compte entreprise'}</button><p class="text-center text-xs opacity-60 mt-4">100% Offline • Données sécurisées</p></div>`}

function login(){let tel=document.getElementById('tel').value.trim(),mdp=document.getElementById('mdp').value;if(!tel||!mdp)return alert('Remplis ton numéro et mot de passe');if(!DB.entreprise){let nom=document.getElementById('nomEnt').value.trim(),secteur=document.getElementById('secteur').value;if(!nom)return alert('Donne le nom de ton entreprise');DB.entreprise={nom,secteur,tel};DB.user={tel,mdp};DB.dateCreation=getToday();DB.ventes=[];DB.produits=[];DB.depenses=[];alert(`Bienvenue ${nom}!\nTon compte ELOHÏM-GESTION est créé.`);}else{if(DB.user.tel!==tel||DB.user.mdp!==mdp)return alert('Numéro ou mot de passe incorrect');}saveDB();showDashboard()}

function showDashboard(){
let today=getToday();
let ventesJour=DB.ventes.filter(v=>v.date===today);
let depensesJour=DB.depenses.filter(d=>d.date===today);
let ca=ventesJour.reduce((s,v)=>s+v.montant*(v.qte||1),0);
let coutTotal=ventesJour.reduce((s,v)=>s+v.cout*(v.qte||1),0);
let depensesTotal=depensesJour.reduce((s,d)=>s+d.montant,0);
let benefice=ca-coutTotal-depensesTotal;

document.getElementById('app').innerHTML=`<div class="max-w-7xl mx-auto fade-in">
<div class="glass rounded-3xl p-4 md:p-6 mb-4 text-white">
<div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
<div><h1 class="text-xl md:text-2xl font-bold">${DB.entreprise.nom}</h1><p class="opacity-80 text-sm">${DB.entreprise.secteur} • ${today}</p></div>
<div class="flex gap-2"><button onclick="showStats()" class="bg-white/20 px-3 py-2 rounded-xl text-sm btn-hover">📊 Stats</button><button onclick="logout()" class="bg-red-500 px-3 py-2 rounded-xl text-sm btn-hover">Déconnexion</button></div>
</div>
</div>

<div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
<div class="glass rounded-2xl p-3 md:p-4 text-white text-center btn-hover"><p class="opacity-80 text-xs">CHIFFRE D'AFFAIRES</p><p class="text-lg md:text-2xl font-bold">${ca.toLocaleString()}</p></div>
<div class="glass rounded-2xl p-3 md:p-4 text-white text-center btn-hover"><p class="opacity-80 text-xs">BÉNÉFICE NET</p><p class="text-lg md:text-2xl font-bold benefice">${benefice.toLocaleString()}</p></div>
<div class="glass rounded-2xl p-3 md:p-4 text-white text-center btn-hover"><p class="opacity-80 text-xs">DÉPENSES</p><p class="text-lg md:text-2xl font-bold text-orange-300">${depensesTotal.toLocaleString()}</p></div>
<div class="glass rounded-2xl p-3 md:p-4 text-white text-center btn-hover"><p class="opacity-80 text-xs">NB VENTES</p><p class="text-lg md:text-2xl font-bold">${ventesJour.length}</p></div>
</div>

<div class="glass rounded-3xl p-2 mb-4 text-white">
<div class="flex gap-2 overflow-x-auto">
<button onclick="switchTab('caisse')" class="px-4 py-2 rounded-xl text-sm whitespace-nowrap ${currentTab==='caisse'?'tab-active':''}">💰 Caisse</button>
<button onclick="switchTab('stock')" class="px-4 py-2 rounded-xl text-sm whitespace-nowrap ${currentTab==='stock'?'tab-active':''}">📦 Stock</button>
<button onclick="switchTab('depenses')" class="px-4 py-2 rounded-xl text-sm whitespace-nowrap ${currentTab==='depenses'?'tab-active':''}">💸 Dépenses</button>
<button onclick="switchTab('ventes')" class="px-4 py-2 rounded-xl text-sm whitespace-nowrap ${currentTab==='ventes'?'tab-active':''}">🧾 Ventes</button>
</div>
</div>

<div id="tabContent">${renderTabContent()}</div>

<div class="text-center text-white opacity-60 text-xs mt-4"><p>${APP_NAME} • Licence ${DB.entreprise.nom} • ${APP_VERSION}</p></div>
</div>`}

function switchTab(tab){currentTab=tab;showDashboard()}

function renderTabContent(){
if(currentTab==='caisse')return renderCaisse();
if(currentTab==='stock')return renderStock();
if(currentTab==='depenses')return renderDepenses();
if(currentTab==='ventes')return renderVentes();
}

function renderCaisse(){return`<div class="glass rounded-3xl p-4 md:p-6 mb-4 text-white fade-in">
<h2 class="text-lg md:text-xl font-bold mb-4">💰 Nouvelle Vente</h2>
<div class="grid grid-cols-1 md:grid-cols-6 gap-3">
<select id="produitSelect" onchange="selectProduit()" class="p-3 rounded-xl text-black font-semibold">
<option value="">-- Choisir produit --</option>
${DB.produits.map(p=>`<option value="${p.nom}" data-prix="${p.prix}" data-cout="${p.cout}" data-stock="${p.stock}">${p.nom} (${p.stock} en stock)</option>`).join('')}
</select>
<input id="produit" placeholder="Ou taper nom produit" class="p-3 rounded-xl text-black font-semibold">
<input id="montant" type="number" placeholder="Prix vente" class="p-3 rounded-xl text-black font-semibold">
<input id="cout" type="number" placeholder="Prix achat" class="p-3 rounded-xl text-black font-semibold">
<input id="qte" type="number" placeholder="Qté" value="1" class="p-3 rounded-xl text-black font-semibold">
<select id="paiement" class="p-3 rounded-xl text-black font-semibold"><option>Wave</option><option>MTN MoMo</option><option>Orange Money</option><option>Cash</option></select>
<button onclick="addVente()" class="bg-green-500 p-3 rounded-xl font-bold btn-hover">✓ Encaisser</button>
</div>
<p class="text-xs opacity-70 mt-2">Astuce: Choisis un produit dans la liste OU tape un nouveau nom. Les prix se remplissent auto.</p>
</div>`}

function selectProduit(){
let sel=document.getElementById('produitSelect');
if(sel.value){
let opt=sel.options[sel.selectedIndex];
document.getElementById('produit').value=opt.value;
document.getElementById('montant').value=opt.dataset.prix;
document.getElementById('cout').value=opt.dataset.cout;
}
}

function renderStock(){return`<div class="glass rounded-3xl p-4 md:p-6 mb-4 text-white fade-in">
<div class="flex justify-between items-center mb-4"><h2 class="text-lg md:text-xl font-bold">📦 Gestion Stock</h2><button onclick="addProduit()" class="bg-blue-500 px-4 py-2 rounded-xl text-sm btn-hover">+ Ajouter Produit</button></div>
<div class="max-h-96 overflow-y-auto space-y-2">
${DB.produits.length?DB.produits.map((p,i)=>`<div class="bg-white/10 p-3 rounded-xl flex justify-between items-center">
<div><p class="font-bold">${p.nom}</p><p class="text-xs opacity-80">Achat: ${p.cout}F • Vente: ${p.prix}F • Bénéf: <span class="benefice">${p.prix-p.cout}F</span></p></div>
<div class="text-right"><p class="font-bold ${p.stock<=5?(p.stock==0?'stock-epuise':'stock-faible'):''}">Stock: ${p.stock}</p><button onclick="editStock(${i})" class="text-blue-300 text-xs mr-2">Modif</button><button onclick="delProduit(${i})" class="text-red-300 text-xs">Suppr</button></div>
</div>`).join(''):`<div class="text-center py-8 opacity-60"><p>Aucun produit en stock</p><p class="text-sm">Clique "Ajouter Produit" pour commencer</p></div>`}
</div></div>`}

function renderDepenses(){let depensesJour=DB.depenses.filter(d=>d.date===getToday());return`<div class="glass rounded-3xl p-4 md:p-6 mb-4 text-white fade-in">
<h2 class="text-lg md:text-xl font-bold mb-4">💸 Dépenses du Jour</h2>
<div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4">
<input id="depNom" placeholder="Nom dépense ex: Loyer" class="p-3 rounded-xl text-black font-semibold">
<input id="depMontant" type="number" placeholder="Montant FCFA" class="p-3 rounded-xl text-black font-semibold">
<button onclick="addDepense()" class="bg-orange-500 p-3 rounded-xl font-bold btn-hover">+ Ajouter</button>
</div>
<div class="max-h-96 overflow-y-auto space-y-2">
${depensesJour.length?depensesJour.map((d,i)=>`<div class="bg-white/10 p-3 rounded-xl flex justify-between items-center">
<div><p class="font-bold">${d.nom}</p><p class="text-xs opacity-80">${d.heure}</p></div>
<div class="text-right"><p class="font-bold text-orange-300">${d.montant.toLocaleString()} F</p><button onclick="delDepense(${i})" class="text-red-300 text-xs">Suppr</button></div>
</div>`).join(''):`<div class="text-center py-8 opacity-60"><p>Aucune dépense aujourd’hui</p></div>`}
</div></div>`}

function renderVentes(){let ventesJour=DB.ventes.filter(v=>v.date===getToday());return`<div class="glass rounded-3xl p-4 md:p-6 text-white fade-in">
<div class="flex justify-between items-center mb-4"><h2 class="text-lg md:text-xl font-bold">🧾 Ventes du jour (${ventesJour.length})</h2>
<div class="flex gap-2"><button onclick="printPDF()" class="bg-blue-500 px-3 py-2 rounded-xl text-sm btn-hover">🖨️ PDF</button><button onclick="exportExcel()" class="bg-emerald-500 px-3 py-2 rounded-xl text-sm btn-hover">📊 Excel</button></div></div>
<div class="max-h-96 overflow-y-auto space-y-2">
${ventesJour.length?ventesJour.map((v,i)=>`<div class="bg-white/10 p-3 rounded-xl flex justify-between items-center">
<div><p class="font-bold">${v.produit} x${v.qte||1}</p><p class="text-xs opacity-80">${v.heure} • ${v.paiement} • Bénéf: <span class="benefice">${((v.montant-v.cout)*(v.qte||1)).toLocaleString()} F</span></p></div>
<div class="text-right"><p class="font-bold">${v.montant.toLocaleString()} F</p><button onclick="delVente(${i})" class="text-red-300 text-xs">Suppr</button></div>
</div>`).join(''):`<div class="text-center py-8 opacity-60"><p>Aucune vente aujourd’hui</p></div>`}
</div></div>`}

function addVente(){
let produit=document.getElementById('produit').value.trim();
let montant=parseInt(document.getElementById('montant').value);
let cout=parseInt(document.getElementById('cout').value)||0;
let qte=parseInt(document.getElementById('qte').value)||1;
let paiement=document.getElementById('paiement').value;
if(!produit||!montant||montant<=0)return alert('Remplis le produit et un prix de vente valide');
let prodStock=DB.produits.find(p=>p.nom.toLowerCase()===produit.toLowerCase());
if(prodStock&&prodStock.stock<qte)return alert(`Stock insuffisant! Il reste ${prodStock.stock} ${produit}`);
if(prodStock){prodStock.stock-=qte;if(prodStock.stock<0)prodStock.stock=0}
DB.ventes.unshift({produit,montant,cout,qte,paiement,heure:getTime(),date:getToday(),timestamp:Date.now()});
saveDB();showDashboard();
document.getElementById('produit').value='';document.getElementById('produitSelect').value='';document.getElementById('montant').value='';document.getElementById('cout').value='';document.getElementById('qte').value='1';
}

function addProduit(){
let nom=prompt('Nom du produit:');if(!nom)return;
let prix=parseInt(prompt('Prix de vente:'));if(!prix)return;
let cout=parseInt(prompt('Prix d\'achat:'))||0;
let stock=parseInt(prompt('Quantité en stock:'))||0;
DB.produits.push({nom,prix,cout,stock});saveDB();showDashboard();
}

function editStock(i){
let p=DB.produits[i];
let stock=parseInt(prompt(`Nouveau stock pour ${p.nom}:`,p.stock));
if(!isNaN(stock)){p.stock=stock;saveDB();showDashboard();}
}

function addDepense(){
let nom=document.getElementById('depNom').value.trim();
let montant=parseInt(document.getElementById('depMontant').value);
if(!nom||!montant||montant<=0)return alert('Remplis le nom et montant');
DB.depenses.unshift({nom,montant,heure:getTime(),date:getToday(),timestamp:Date.now()});
saveDB();showDashboard();
document.getElementById('depNom').value='';document.getElementById('depMontant').value='';
}

function delVente(i){let ventesJour=DB.ventes.filter(v=>v.date===getToday());let vente=ventesJour[i];if(confirm(`Supprimer ${vente.produit}?`)){let idx=DB.ventes.findIndex(v=>v.timestamp===vente.timestamp);DB.ventes.splice(idx,1);saveDB();showDashboard();}}
function delProduit(i){if(confirm(`Supprimer ${DB.produits[i].nom}?`)){DB.produits.splice(i,1);saveDB();showDashboard();}}
function delDepense(i){let depensesJour=DB.depenses.filter(d=>d.date===getToday());let dep=depensesJour[i];if(confirm(`Supprimer ${dep.nom}?`)){let idx=DB.depenses.findIndex(d=>d.timestamp===dep.timestamp);DB.depenses.splice(idx,1);saveDB();showDashboard();}}

function logout(){if(confirm('Se déconnecter de '+DB.entreprise.nom+'?')){document.getElementById('app').innerHTML='';showLogin()}}

function printPDF(){
const {jsPDF}=window.jspdf;let doc=new jsPDF();
let ventesJour=DB.ventes.filter(v=>v.date===getToday());
let depensesJour=DB.depenses.filter(d=>d.date===getToday());
let ca=ventesJour.reduce((s,v)=>s+v.montant*(v.qte||1),0);
let coutTotal=ventesJour.reduce((s,v)=>s+v.cout*(v.qte||1),0);
let depensesTotal=depensesJour.reduce((s,d)=>s+d.montant,0);
let benefice=ca-coutTotal-depensesTotal;
doc.setFontSize(22);doc.text(`${DB.entreprise.nom}`,105,20,{align:'center'});
doc.setFontSize(11);doc.text(`${DB.entreprise.secteur}`,105,28,{align:'center'});
doc.setFontSize(14);doc.text(`RAPPORT JOURNALIER DU ${getToday()}`,105,38,{align:'center'});
doc.setFontSize(12);doc.text(`Chiffre d'affaires: ${formatFCFA(ca)}`,20,55);
doc.setFontSize(14);doc.setTextColor(0,150,0);doc.text(`BÉNÉFICE NET: ${formatFCFA(benefice)}`,20,63);
doc.setTextColor(0,0,0);doc.setFontSize(12);doc.text(`Coût marchandises: ${formatFCFA(coutTotal)}`,20,71);
doc.text(`Dépenses: ${formatFCFA(depensesTotal)}`,20,79);
doc.line(20,85,190,85);let y=95;
doc.setFontSize(10);doc.text('Heure',15,y);doc.text('Produit',35,y);doc.text('Vente',75,y);doc.text('Coût',100,y);doc.text('Bénéf',125,y);doc.text('Qté',150,y);doc.text('Total',170,y);
y+=5;doc.line(15,y,190,y);y+=7;
ventesJour.forEach(v=>{if(y>270){doc.addPage();y=20}
let total=(v.montant-v.cout)*(v.qte||1);
doc.text(v.heure,15,y);doc.text(v.produit.substring(0,15),35,y);doc.text(v.montant.toString(),75,y);doc.text(v.cout.toString(),100,y);
doc.setTextColor(0,150,0);doc.text(total.toString(),125,y);doc.setTextColor(0,0,0);
doc.text((v.qte||1).toString(),150,y);doc.text((v.montant*(v.qte||1)).toString(),170,y);y+=7});
doc.setFontSize(8);doc.text(`Généré par ${APP_NAME} • ${new Date().toLocaleString('fr-FR')}`,105,285,{align:'center'});
doc.save(`Rapport_${DB.entreprise.nom}_${getToday().replace(/\//g,'-')}.pdf`);
}

function exportExcel(){
let ventesJour=DB.ventes.filter(v=>v.date===getToday());
if(!ventesJour.length)return alert('Aucune vente à exporter');
let data=ventesJour.map(v=>({Date:v.date,Heure:v.heure,Produit:v.produit,Qte:v.qte||1,'Prix Vente':v.montant,'Prix Achat':v.cout,'Bénéfice Unitaire':v.montant-v.cout,'Bénéfice Total':(v.montant-v.cout)*(v.qte||1),'Mode Paiement':v.paiement}));
let ws=XLSX.utils.json_to_sheet(data);let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Ventes');
XLSX.writeFile(wb,`Ventes_${DB.entreprise.nom}_${getToday().replace(/\//g,'-')}.xlsx`);
}

function showStats(){
let caTotal=DB.ventes.reduce((s,v)=>s+v.montant*(v.qte||1),0);
let coutTotal=DB.ventes.reduce((s,v)=>s+v.cout*(v.qte||1),0);
let depensesTotal=DB.depenses.reduce((s,d)=>s+d.montant,0);
let benefTotal=caTotal-coutTotal-depensesTotal;
alert(`STATISTIQUES ${DB.entreprise.nom}\n\nChiffre d'affaires: ${formatFCFA(caTotal)}\nCoût marchandises: ${formatFCFA(coutTotal)}\nDépenses: ${formatFCFA(depensesTotal)}\n\nBÉNÉFICE TOTAL: ${formatFCFA(benefTotal)}\n\nVentes: ${DB.ventes.length}\nProduits en stock: ${DB.produits.length}\nClient depuis: ${DB.dateCreation}`);
}

loadDB();showLogin();
</script>
</body>
</html>
